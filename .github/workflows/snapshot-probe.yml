# Phase 1 probe: does every data source answer from GitHub's servers?
# Runs the snapshot and prints the manifest. No deploy, no commits.
name: snapshot-probe

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Snapshot all allow-listed sources
        run: python serve.py --snapshot snap || echo "snapshot exited with $?"

      - name: Print manifest
        if: always()
        run: |
          cat snap/manifest.json
          # two short annotations (GitHub keeps only 10 notices per step): fresh sources, failed sources
          python -c "import json; s=json.load(open('snap/manifest.json'))['sources']; print('::notice title=snapshot fresh::' + ', '.join(k for k, e in s.items() if e['ok']))"
          python -c "import json; s=json.load(open('snap/manifest.json'))['sources']; bad=[k + ' ' + e['status'] + ' ' + str(e.get('error_kind')) + ' ' + str(e.get('http_status') or '') for k, e in s.items() if not e['ok']]; print('::warning title=snapshot failed::' + (', '.join(bad) or 'none'))"
          {
            echo "### Snapshot probe ($(date -u +%FT%TZ), runner: ${RUNNER_OS})"
            echo '| source | status | error |'
            echo '|---|---|---|'
            python -c "import json; m=json.load(open('snap/manifest.json')); [print(f\"| {k} | {e['status']} | {(e.get('error_kind') or '') + ' ' + str(e.get('http_status') or '')} |\") for k, e in m['sources'].items()]"
          } >> "$GITHUB_STEP_SUMMARY"
